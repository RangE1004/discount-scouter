<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할인스카우터</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { padding: 20px; font-family: sans-serif; background: #f4f6f8; margin: 0; }
    h2 { text-align: center; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 15px; margin-bottom: 5px; }
    select, input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; box-sizing: border-box; }
    input[type="password"] { font-family: monospace; letter-spacing: 1px; }
    button.save-btn { background: #333; color: white; font-weight: bold; border: none; margin-top: 20px; transition: 0.3s; }
    
    .db-result { background: #e8f0fe; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; color: #1a73e8; }
    .ai-result { background: #fce8e6; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 14px; color: #c5221f; border: 1px solid #fad2cf; }
    .loading { color: #555; font-weight: bold; text-align: center; margin: 15px 0; }
  </style>
</head>
<body>
  <h2>💸 할인스카우터</h2>

  <!-- 1. 프로필 & 보안 설정 -->
  <div class="card" id="profile-card">
    <h3 style="margin-top:0;">👤 맞춤 조건 및 보안 설정</h3>
    
    <label>🔑 보안 API 키 (최초 1회 입력)</label>
    <input type="password" id="api-key" placeholder="AQ. 으로 시작하는 전체 키 입력">

    <label>내 신분</label>
    <select id="user-status">
      <option value="none">해당 없음 (일반)</option>
      <option value="military">군인</option>
      <option value="student">대학생</option>
    </select>

    <label>주력 결제 카드</label>
    <select id="user-card">
      <option value="none">선택 안함</option>
      <option value="kb">국민카드</option>
      <option value="shinhan">신한카드</option>
      <option value="hyundai">현대카드</option>
    </select>
    
    <button class="save-btn" id="save-btn" onclick="saveProfile()">설정 안전하게 저장하기</button>
  </div>

  <!-- 2. 분석 결과 -->
  <div class="card" id="result-card" style="display: none; border: 2px solid #0056ff;">
    <h3 style="margin-top:0; color:#0056ff;">🔥 스카우터 분석 결과</h3>
    <p style="font-size:12px; color:#666; word-break:break-all;" id="link-text"></p>
    
    <div id="static-db-area"></div>
    <div id="ai-analysis-area">
      <div class="loading" id="ai-loading">🤖 초고속 AI(Gemini 2.0 Flash)로 최적 할인가 분석 중...</div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const staticBenefitDB = {
      'military': '🎖️ [신분혜택] 군인공제회/나라사랑카드 연계 쇼핑몰 경유 시 추가 적립.',
      'student': '🎓 [신분혜택] 학생복지스토어(학생 전용 혜택) 적용 가능.',
      'kb': '💳 [카드혜택] 국민카드: 이번 달 온라인 쇼핑 무이자 할부 및 스타샵 적립.',
      'shinhan': '💳 [카드혜택] 신한카드: 결제 전 MySHOP(마이샵) 혜택 쿠폰 확인.',
      'hyundai': '💳 [카드혜택] 현대카드: M포인트 결제 가능 가맹점 여부 확인.'
    };

    // 화면 켜질 때 기존 정보 불러오기 (더 안정적인 방식으로 변경)
    document.addEventListener('DOMContentLoaded', () => {
      if(localStorage.getItem('apiKey')) document.getElementById('api-key').value = localStorage.getItem('apiKey');
      if(localStorage.getItem('userStatus')) document.getElementById('user-status').value = localStorage.getItem('userStatus');
      if(localStorage.getItem('userCard')) document.getElementById('user-card').value = localStorage.getItem('userCard');
    });

    // 직관적인 저장 로직
    function saveProfile() {
      const keyInput = document.getElementById('api-key').value.trim();
      
      if (!keyInput.startsWith("AQ.")) {
        alert("⚠️ API 키는 'AQ.'로 시작해야 합니다. 다시 확인해주세요.");
        return;
      }
      
      localStorage.setItem('apiKey', keyInput);
      localStorage.setItem('userStatus', document.getElementById('user-status').value);
      localStorage.setItem('userCard', document.getElementById('user-card').value);
      
      // 버튼 자체를 초록색 성공 표시로 바꾸기
      const btn = document.getElementById('save-btn');
      btn.innerText = "✅ 내 폰에 저장 완료!";
      btn.style.background = "#28a745";
      
      // 2초 뒤에 원래 버튼으로 복구
      setTimeout(() => {
        btn.innerText = "설정 안전하게 저장하기";
        btn.style.background = "#333";
      }, 2000);
    }

    // 공유하기 낚아채기
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedData = urlParams.get('text') || urlParams.get('url') || urlParams.get('title');

      if (sharedData) {
        document.getElementById('profile-card').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
        document.getElementById('link-text').innerText = "🔗 수신된 데이터: " + sharedData;

        const myStatus = localStorage.getItem('userStatus') || 'none';
        const myCard = localStorage.getItem('userCard') || 'none';

        let staticHtml = '<b>📌 고정 혜택 스캔 완료</b><br>';
        let hasBenefit = false;
        if(staticBenefitDB[myStatus]) { staticHtml += staticBenefitDB[myStatus] + '<br>'; hasBenefit = true; }
        if(staticBenefitDB[myCard]) { staticHtml += staticBenefitDB[myCard]; hasBenefit = true; }
        if(!hasBenefit) { staticHtml += '선택된 조건에 맞는 고정 혜택이 없습니다.'; }
        
        document.getElementById('static-db-area').innerHTML = `<div class="db-result">${staticHtml}</div>`;

        analyzeWithAI(sharedData, myStatus, myCard);
      }
    });

    async function analyzeWithAI(sharedText, status, card) {
      const SECRET_AI_KEY = localStorage.getItem('apiKey');
      
      if(!SECRET_AI_KEY || !SECRET_AI_KEY.startsWith("AQ.")) {
        document.getElementById('ai-loading').innerHTML = "❌ <b>보안 키 누락</b><br><span style='font-size:12px;color:red;'>앱을 다시 켜고 '보안 API 키'를 먼저 입력한 뒤 저장해주세요.</span>";
        return;
      }

      const apiEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${SECRET_AI_KEY}`;
      const statusText = document.getElementById('user-status').querySelector(`option[value="${status}"]`).innerText;
      const cardText = document.getElementById('user-card').querySelector(`option[value="${card}"]`).innerText;

      const prompt = `당신은 쇼핑 할인 분석 전문가입니다. 사용자가 쇼핑앱에서 공유한 텍스트(상품명 및 링크 포함)는 다음과 같습니다:\n"${sharedText}"\n\n사용자의 신분은 '${statusText}'이고 주력 결제 카드는 '${cardText}'입니다.\n위 정보를 바탕으로 이 상품을 해당 사용자가 가장 저렴하게 살 수 있는 최적의 혜택 조합 시나리오와 결제 시 주의할 점을 딱 3문장으로 날카롭게 요약해주세요.`;

      try {
        const response = await fetch(apiEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || '서버 에러가 발생했습니다.');

        const aiResultText = data.candidates[0].content.parts[0].text;
        document.getElementById('ai-analysis-area').innerHTML = `
          <div class="ai-result">
            <b>✨ AI 실시간 최적화 분석 완료</b><br><br>
            ${aiResultText.replace(/\n/g, '<br>')}
          </div>
        `;
      } catch (error) {
        document.getElementById('ai-loading').innerHTML = `❌ <b>AI 분석 실패</b><br><span style='font-size:12px;color:red;'>${error.message}</span>`;
      }
    }
  </script>
</body>
</html>
