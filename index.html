<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할인스카우터</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { padding: 20px; font-family: sans-serif; background: #f4f6f8; margin: 0; }
    h2 { text-align: center; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 15px; margin-bottom: 5px; }
    select, input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; box-sizing: border-box; }
    input[type="password"] { font-family: monospace; letter-spacing: 1px; }
    button.save-btn { background: #333; color: white; font-weight: bold; border: none; margin-top: 20px; }
    
    .db-result { background: #e8f0fe; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; color: #1a73e8; }
    .ai-result { background: #fce8e6; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 14px; color: #c5221f; border: 1px solid #fad2cf; }
    .loading { color: #555; font-weight: bold; text-align: center; margin: 15px 0; }
  </style>
</head>
<body>
  <h2>💸 할인스카우터</h2>

  <!-- 1. 프로필 & 보안 설정 모듈 -->
  <div class="card" id="profile-card">
    <h3 style="margin-top:0;">👤 맞춤 조건 및 보안 설정</h3>
    
    <!-- 🔒 깃허브를 거치지 않고 내 폰에만 저장되는 안전한 API 키 입력칸 -->
    <label>🔑 보안 API 키 (최초 1회 입력)</label>
    <input type="password" id="api-key" placeholder="AQ. 으로 시작하는 전체 키 입력">

    <label>내 신분</label>
    <select id="user-status">
      <option value="none">해당 없음 (일반)</option>
      <option value="military">군인</option>
      <option value="student">대학생</option>
    </select>

    <label>주력 결제 카드</label>
    <select id="user-card">
      <option value="none">선택 안함</option>
      <option value="kb">국민카드</option>
      <option value="shinhan">신한카드</option>
      <option value="hyundai">현대카드</option>
    </select>
    
    <button class="save-btn" onclick="saveProfile()">설정 안전하게 저장하기</button>
  </div>

  <!-- 2. 분석 결과 렌더링 모듈 -->
  <div class="card" id="result-card" style="display: none; border: 2px solid #0056ff;">
    <h3 style="margin-top:0; color:#0056ff;">🔥 스카우터 분석 결과</h3>
    <p style="font-size:12px; color:#666; word-break:break-all;" id="link-text"></p>
    
    <div id="static-db-area"></div>
    <div id="ai-analysis-area">
      <div class="loading" id="ai-loading">🤖 초고속 AI(Gemini 2.0 Flash)로 최적 할인가 분석 중...</div>
    </div>
  </div>

  <script>
    // 서비스 워커 등록 (PWA 필수)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const staticBenefitDB = {
      'military': '🎖️ [신분혜택] 군인공제회/나라사랑카드 연계 쇼핑몰 경유 시 추가 적립 확인 요망.',
      'student': '🎓 [신분혜택] 학생복지스토어(학생 전용 혜택) 적용 가능 여부 확인 요망.',
      'kb': '💳 [카드혜택] 국민카드: 이번 달 온라인 쇼핑 무이자 할부 및 스타샵 적립 대상인지 확인하세요.',
      'shinhan': '💳 [카드혜택] 신한카드: 결제 전 MySHOP(마이샵) 혜택 쿠폰이 있는지 꼭 확인하세요.',
      'hyundai': '💳 [카드혜택] 현대카드: M포인트 결제 가능 가맹점 여부를 결제창에서 확인하세요.'
    };

    // 앱 실행 시 스마트폰 메모리에서 기존 정보 불러오기
    window.onload = () => {
      if(localStorage.getItem('apiKey')) document.getElementById('api-key').value = localStorage.getItem('apiKey');
      if(localStorage.getItem('userStatus')) document.getElementById('user-status').value = localStorage.getItem('userStatus');
      if(localStorage.getItem('userCard')) document.getElementById('user-card').value = localStorage.getItem('userCard');
    };

    // 정보를 스마트폰 내부 메모리에만 암호화하여 저장
    function saveProfile() {
      const keyInput = document.getElementById('api-key').value.trim();
      if (!keyInput.startsWith("AQ.")) {
        alert("⚠️ API 키는 'AQ.'로 시작해야 합니다. 구글에서 발급받은 키를 정확히 넣어주세요.");
        return;
      }
      localStorage.setItem('apiKey', keyInput);
      localStorage.setItem('userStatus', document.getElementById('user-status').value);
      localStorage.setItem('userCard', document.getElementById('user-card').value);
      alert('✅ 설정이 스마트폰 내부에 안전하게 저장되었습니다!\n이제 쇼핑앱에서 상품을 공유해보세요.');
    }

    // 공유하기 텍스트 낚아채기
