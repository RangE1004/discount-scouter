<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할인스카우터</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { padding: 20px; font-family: sans-serif; background: #f4f6f8; margin: 0; }
    h2 { text-align: center; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 15px; margin-bottom: 5px; }
    select, input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; box-sizing: border-box; }
    input[type="password"] { font-family: monospace; letter-spacing: 1px; }
    button.save-btn { background: #333; color: white; font-weight: bold; border: none; margin-top: 20px; transition: 0.3s; }
    
    .db-result { background: #e8f0fe; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 14px; color: #1a73e8; line-height: 1.5; }
    .ai-result { background: #fce8e6; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 14px; color: #c5221f; border: 1px solid #fad2cf; line-height: 1.5; }
    .loading { color: #0056ff; font-weight: bold; text-align: center; margin: 15px 0; font-size: 15px; }
    .retry-msg { color: #d93025; font-size: 12px; display: block; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>💸 할인스카우터</h2>

  <!-- 1. 프로필 & 보안 설정 -->
  <div class="card" id="profile-card">
    <h3 style="margin-top:0;">👤 맞춤 조건 설정</h3>
    <label>🔑 보안 API 키 (최초 1회)</label>
    <input type="password" id="api-key" placeholder="AQ. 으로 시작하는 전체 키 입력">
    <label>내 신분</label>
    <select id="user-status">
      <option value="none">해당 없음 (일반)</option>
      <option value="military">군인</option>
      <option value="student">대학생</option>
    </select>
    <label>주력 결제 카드</label>
    <select id="user-card">
      <option value="none">선택 안함</option>
      <option value="kb">국민카드</option>
      <option value="shinhan">신한카드</option>
      <option value="hyundai">현대카드</option>
    </select>
    <button class="save-btn" id="save-btn" onclick="saveProfile()">내 폰에 안전하게 저장</button>
  </div>

  <!-- 2. 분석 결과 (고정 DB + AI 결합) -->
  <div class="card" id="result-card" style="display: none; border: 2px solid #0056ff;">
    <h3 style="margin-top:0; color:#0056ff;">🔥 스카우터 분석 결과</h3>
    <p style="font-size:12px; color:#666; word-break:break-all;" id="link-text"></p>
    
    <div id="static-db-area"></div>
    <div id="ai-analysis-area">
      <div class="loading" id="ai-loading">
        ⏳ 실시간 추가 할인율 확인중...
        <span class="retry-msg" id="ai-retry-msg"></span>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    // ==========================================
    // 🗂️ 내장형 스프레드시트 (플랫폼별 고정 DB 세분화)
    // ==========================================
    const benefitSpreadsheet = {
      'coupang': {
        name: '쿠팡(Coupang)',
        default: '🚀 [기본] 와우 멤버십 전용 즉시할인 및 무료배송 여부 확인 필수.',
        cards: {
          'kb': '💳 [국민] 쿠팡 로켓제휴 상품 최대 20% 즉시할인 여부 결제창 확인.',
          'shinhan': '💳 [신한] 신한플레이 앱 마이샵(MyShop) 쿠팡 캐시백 태그 확인.',
          'hyundai': '💳 [현대] M포인트 5% 사용 가능 여부 결제창 확인.'
        },
        status: {
          'military': '🎖️ [군인] 쿠팡은 특정 신분보다 와우 회원 할인이 절대적으로 유리합니다.',
          'student': '🎓 [학생] 쿠팡이츠/플레이 연계 대학생 전용 와우 프로모션 대상인지 확인하세요.'
        }
      },
      'naver': {
        name: '네이버쇼핑(Naver)',
        default: '🟩 [기본] 네이버플러스 멤버십 추가 4~5% 적립 마크 확인 필수.',
        cards: {
          'kb': '💳 [국민] 간편결제(네이버페이) 등록 후 결제 시 혜택 확인.',
          'shinhan': '💳 [신한] 네이버페이 제휴 신한카드 결제 시 최대 5% 추가 적립.',
          'hyundai': '💳 [현대] 네이버페이 제휴 현대카드(네이버 현대카드) 혜택 확인.'
        },
        status: {
          'military': '🎖️ [군인] 네이버페이 포인트 충전 시 나라사랑카드 혜택 교차 확인.',
          'student': '🎓 [학생] 네이버플러스 멤버십 스튜던트(무료 혜택 및 전용 쿠폰) 적용 요망.'
        }
      },
      'musinsa': {
        name: '무신사(Musinsa)',
        default: '👕 [기본] 상품별 적용 가능한 무신사 등급별/앱전용 쿠폰 다운로드 필수.',
        cards: {
          'kb': '💳 [국민] 무신사페이 등록 결제 시 추가 할인 프로모션 확인.',
          'shinhan': '💳 [신한] 신한플레이 마이샵 혜택 및 청구할인 이벤트 확인.',
          'hyundai': '💳 [현대] 무신사 현대카드 전용 5% 청구할인 등 혜택 확인.'
        },
        status: {
          'military': '🎖️ [군인] 국군 장병 전용 무신사 나라사랑 상시 할인 적용 대상입니다.',
          'student': '🎓 [학생] 학생복지스토어를 경유하여 무신사 접속 시 추가 혜택이 있는지 확인.'
        }
      },
      'common': { // 기타 몰
        name: '일반 쇼핑몰',
        default: '🛒 [기본] 신규가입 웰컴 쿠폰 및 카카오/네이버페이 결제 혜택 확인.',
        cards: {
          'kb': '💳 [국민] 국민카드 이번 달 온라인 쇼핑 무이자 할부 혜택 대상.',
          'shinhan': '💳 [신한] 신한플레이 마이샵(MyShop) 태그 혜택 필수 확인.',
          'hyundai': '💳 [현대] M포인트 5~10% 결제 가능 가맹점 여부 확인.'
        },
        status: {
          'military': '🎖️ [군인] 군인공제회/나라사랑포털 연계 복지몰 경유 시 추가 적립 가능.',
          'student': '🎓 [학생] 학생복지스토어(에브리타임 연계)에서 구매 가능한지 검색 요망.'
        }
      }
    };

    // 링크 분석해서 플랫폼 찾기
    function detectPlatform(text) {
      if(text.includes('coupang') || text.includes('쿠팡')) return 'coupang';
      if(text.includes('naver') || text.includes('네이버')) return 'naver';
      if(text.includes('musinsa') || text.includes('무신사')) return 'musinsa';
      return 'common';
    }

    // 설정 불러오기 및 저장 로직
    document.addEventListener('DOMContentLoaded', () => {
      if(localStorage.getItem('apiKey')) document.getElementById('api-key').value = localStorage.getItem('apiKey');
      if(localStorage.getItem('userStatus')) document.getElementById('user-status').value = localStorage.getItem('userStatus');
      if(localStorage.getItem('userCard')) document.getElementById('user-card').value = localStorage.getItem('userCard');
    });

    function saveProfile() {
      const keyInput = document.getElementById('api-key').value.trim();
      if (!keyInput.startsWith("AQ.")) {
        alert("⚠️ API 키는 'AQ.'로 시작해야 합니다."); return;
      }
      localStorage.setItem('apiKey', keyInput);
      localStorage.setItem('userStatus', document.getElementById('user-status').value);
      localStorage.setItem('userCard', document.getElementById('user-card').value);
      
      const btn = document.getElementById('save-btn');
      btn.innerText = "✅ 내 폰에 저장 완료!"; btn.style.background = "#28a745";
      setTimeout(() => { btn.innerText = "내 폰에 안전하게 저장"; btn.style.background = "#333"; }, 2000);
    }

    // 공유된 링크 수신
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedData = urlParams.get('text') || urlParams.get('url') || urlParams.get('title');

      if (sharedData) {
        document.getElementById('profile-card').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
        document.getElementById('link-text').innerText = "🔗 " + sharedData;

        const myStatus = localStorage.getItem('userStatus') || 'none';
        const myCard = localStorage.getItem('userCard') || 'none';
        const platform = detectPlatform(sharedData.toLowerCase());
        const db = benefitSpreadsheet[platform];

        // 고정 DB (스프레드시트) 렌더링
        let staticHtml = `<b>📌 [${db.name}] 고정 혜택 스캔 결과</b><br><br>`;
        staticHtml += db.default + "<br>";
        if(db.cards[myCard]) staticHtml += db.cards[myCard] + "<br>";
        if(db.status[myStatus]) staticHtml += db.status[myStatus];
        
        document.getElementById('static-db-area').innerHTML = `<div class="db-result">${staticHtml}</div>`;

        // 무한 재시도를 포함한 AI 분석 시작
        analyzeWithAI_Robust(sharedData, myStatus, myCard, platform);
      }
    });

    // ==========================================
    // 🧠 AI 연동 (무한 재시도 + 갇힘 방지 타임아웃 적용)
    // ==========================================
    async function analyzeWithAI_Robust(sharedText, status, card, platformName) {
      const SECRET_AI_KEY = localStorage.getItem('apiKey');
      if(!SECRET_AI_KEY) return;

      const apiEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${SECRET_AI_KEY}`;
      const statusText = document.getElementById('user-status').querySelector(`option[value="${status}"]`).innerText;
      const cardText = document.getElementById('user-card').querySelector(`option[value="${card}"]`).innerText;

      const prompt = `당신은 쇼핑 할인 분석 전문가입니다. 사용자가 쇼핑앱에서 공유한 텍스트는 다음과 같습니다:\n"${sharedText}"\n\n이 쇼핑몰은 '${platformName}' 관련입니다. 사용자의 신분은 '${statusText}', 주력 카드는 '${cardText}'입니다. 앞서 일반적인 고정 혜택은 이미 확인했습니다. \n위 정보를 바탕으로 '지금 이 상품을 구매할 때 즉시 써먹을 수 있는 추가적인 숨은 혜택이나 구매 최적화 팁'을 딱 3문장으로 날카롭게 요약해주세요.`;

      let attempt = 1;

      // 무한 시도 루프 (성공할 때까지)
      while (true) {
        // 갇힘 방지 (Timeout): 10초 동안 대답 없으면 강제 취소
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); 

        try {
          if(attempt > 1) {
            document.getElementById('ai-loading').innerHTML = `⏳ 할인율 확인중...<br><span class="retry-msg">서버 과부하로 재시도 중입니다. (시도 횟수: ${attempt}회)</span>`;
          }

          const response = await fetch(apiEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
            signal: controller.signal // 타임아웃 감시자 부착
          });
          
          clearTimeout(timeoutId); // 응답 오면 타임아웃 해제
          const data = await response.json();

          if (!response.ok) {
            // 503(과부하) 또는 429(요청 너무 많음) 에러면 catch 로 던져서 재시도
            if(response.status === 503 || response.status === 429 || (data.error && data.error.message.includes('high demand'))) {
              throw new Error("high_demand");
            }
            // 다른 심각한 에러(키 오류 등)면 루프 탈출
            throw new Error("fatal_error: " + (data.error?.message || "알 수 없는 오류"));
          }

          // 성공적으로 결과 도출! 루프 탈출
          const aiResultText = data.candidates[0].content.parts[0].text;
          document.getElementById('ai-analysis-area').innerHTML = `
            <div class="ai-result">
              <b>✨ AI 추가 할인/최적화 분석</b><br><br>
              ${aiResultText.replace(/\n/g, '<br>')}
            </div>
          `;
          break; // 루프 종료

        } catch (error) {
          clearTimeout(timeoutId);
          
          // 치명적 에러(비밀번호 틀림 등)면 재시도 중지하고 메시지 띄움
          if (error.message.includes("fatal_error")) {
            document.getElementById('ai-loading').innerHTML = `❌ <b>AI 분석 실패</b><br><span class="retry-msg">${error.message.replace("fatal_error: ", "")}</span>`;
            break; 
          }

          // AbortError(타임아웃 갇힘) 또는 서버 과부하면 3초 대기 후 무한 재시도
          console.log(`[시도 ${attempt} 실패] 3초 후 다시 시도합니다... 원인:`, error.name || error.message);
          attempt++;
          await new Promise(resolve => setTimeout(resolve, 3000)); // 3초 대기
        }
      }
    }
  </script>
</body>
</html>
