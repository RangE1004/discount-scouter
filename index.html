<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할인스카우터</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 모던 화이트 & 네이비 테마 */
    :root {
      --navy: #1b263b;
      --navy-light: #415a77;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --pastel-blue: #e0eaf5;
      --pastel-red: #fbe5e6;
      --text-main: #333333;
      --text-muted: #777777;
    }
    
    body { padding: 20px 15px; font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg-color); margin: 0; color: var(--text-main); }
    
    /* 헤더 로고 */
    .header { text-align: center; margin-bottom: 25px; }
    .header h2 { margin: 0; color: var(--navy); font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
    .logo-icon { display: inline-block; background: var(--navy); color: white; border-radius: 8px; padding: 2px 8px; margin-right: 5px; font-size: 20px; }
    
    /* 카드 디자인 */
    .card { background: var(--card-bg); padding: 25px 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); margin-bottom: 20px; }
    .card h3 { margin-top: 0; color: var(--navy); font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 20px; }
    
    /* 폼 요소 */
    .form-group { margin-bottom: 15px; }
    label { font-weight: 600; font-size: 13px; color: var(--navy-light); display: block; margin-bottom: 6px; }
    select, input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #e0e0e0; font-size: 15px; box-sizing: border-box; background: #fafafa; transition: border 0.2s; }
    select:focus, input:focus { outline: none; border-color: var(--navy); background: #fff; }
    
    /* 버튼 */
    button.save-btn { width: 100%; background: var(--navy); color: white; font-size: 16px; font-weight: bold; border: none; padding: 15px; border-radius: 10px; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 10px rgba(27, 38, 59, 0.2); }
    button.save-btn:active { transform: translateY(2px); }
    
    /* 분석 결과창 */
    .result-link { font-size: 12px; color: var(--text-muted); word-break: break-all; margin-bottom: 15px; background: #f1f3f5; padding: 10px; border-radius: 8px; }
    
    .db-result { background: var(--pastel-blue); padding: 16px; border-radius: 12px; margin-bottom: 15px; font-size: 14px; color: #1e3a5f; line-height: 1.6; border: 1px solid #c9dcf0; }
    .db-result b { color: var(--navy); display: block; margin-bottom: 8px; font-size: 15px; }
    
    .ai-result { background: var(--pastel-red); padding: 16px; border-radius: 12px; font-size: 14px; color: #7a1d1d; line-height: 1.6; border: 1px solid #f7c3c5; }
    .ai-result b { color: #a50000; display: block; margin-bottom: 8px; font-size: 15px; }
    
    .loading { color: var(--navy); font-weight: 700; text-align: center; margin: 20px 0; font-size: 15px; }
    .retry-msg { color: #d93025; font-size: 12px; display: block; margin-top: 8px; font-weight: normal; }
  </style>
</head>
<body>
  <div class="header">
    <h2><span class="logo-icon">%</span>할인스카우터</h2>
  </div>

  <!-- 1. 프로필 & 보안 설정 -->
  <div class="card" id="profile-card">
    <h3>내 맞춤 프로필 설정</h3>
    
    <div class="form-group">
      <label>🔑 보안 API 키 (최초 1회 폰에만 저장)</label>
      <input type="password" id="api-key" placeholder="AQ. 으로 시작하는 키 입력">
    </div>

    <div class="form-group">
      <label>💳 주력 결제 카드</label>
      <select id="user-card">
        <option value="none">선택 안함</option>
        <option value="kb">국민카드</option>
        <option value="shinhan">신한카드</option>
        <option value="hyundai">현대카드</option>
        <option value="samsung">삼성카드</option>
      </select>
    </div>

    <div class="form-group">
      <label>👑 유료 멤버십 가입</label>
      <select id="user-membership">
        <option value="none">가입 안함 (일반)</option>
        <option value="wow">쿠팡 와우회원 (무료배송)</option>
        <option value="naver">네이버플러스 멤버십 (추가적립)</option>
        <option value="universe">신세계 유니버스 클럽</option>
      </select>
    </div>

    <div class="form-group">
      <label>📱 통신사 혜택</label>
      <select id="user-telecom">
        <option value="none">선택 안함</option>
        <option value="skt">SKT (T멤버십)</option>
        <option value="kt">KT (KT멤버십)</option>
        <option value="lgu">LG U+ (U+멤버십)</option>
      </select>
    </div>

    <div class="form-group">
      <label>🎓 특정 신분</label>
      <select id="user-status">
        <option value="none">해당 없음 (일반)</option>
        <option value="military">군인</option>
        <option value="student">대학생</option>
      </select>
    </div>
    
    <button class="save-btn" id="save-btn" onclick="saveProfile()">설정 완료</button>
  </div>

  <!-- 2. 분석 결과 -->
  <div class="card" id="result-card" style="display: none; border: 2px solid var(--navy);">
    <h3>🎯 스카우터 타겟팅 완료</h3>
    <div class="result-link" id="link-text"></div>
    
    <div id="static-db-area"></div>
    <div id="ai-analysis-area">
      <div class="loading" id="ai-loading">
        ⏳ AI가 추가 혜택을 발굴하고 있습니다...
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    // ==========================================
    // 🗂️ 세분화된 고정 DB
    // ==========================================
    const benefitDB = {
      'coupang': {
        name: '쿠팡',
        base: '로켓배송 상품인지 확인하세요.',
        membership: { 'wow': '🚀 [멤버십] 와우회원 적용: 100% 무료배송 및 와우 전용 즉시할인 적용.' },
        card: { 'kb': '💳 [카드] 국민카드: 로켓제휴 최대 20% 즉시할인 가능성.', 'samsung': '💳 [카드] 삼성카드: 쿠팡 결제 시 할인 프로모션 확인.' }
      },
      'naver': {
        name: '네이버쇼핑',
        base: '네이버페이 아이콘이 있는지 확인하세요.',
        membership: { 'naver': '🟩 [멤버십] 네이버플러스: Npay 결제 시 최대 5% 추가 적립 확정.' },
        telecom: { 'lgu': '📱 [통신사] LG U+: 네이버플러스 멤버십 무료 혜택(구독) 연동 가능.' },
        card: { 'hyundai': '💳 [카드] 현대카드: 네이버현대카드 결제 시 추가 5% 적립.' }
      },
      '11st': {
        name: '11번가',
        base: 'T멤버십 적용 아이콘이 있는지 확인하세요.',
        telecom: { 'skt': '📱 [통신사] SKT: T멤버십 최대 11% 할인(또는 적립) 무조건 적용하세요.' },
        membership: { 'universe': '👑 [멤버십] 유니버스 클럽: 11번가 전용 할인 쿠폰 팩 다운로드 필수.' }
      },
      'common': {
        name: '기타 쇼핑몰',
        base: '신규 가입 웰컴 쿠폰이나 카카오페이 결제 혜택을 먼저 찾아보세요.',
        status: { 'military': '🎖️ [군인] 복지몰(나라사랑포털 등)에 같은 상품이 더 싼지 먼저 검색하세요.' }
      }
    };

    function detectPlatform(text) {
      if(text.includes('coupang') || text.includes('쿠팡')) return 'coupang';
      if(text.includes('naver') || text.includes('네이버')) return 'naver';
      if(text.includes('11st') || text.includes('11번가')) return '11st';
      return 'common';
    }

    // 설정 불러오기
    document.addEventListener('DOMContentLoaded', () => {
      const fields = ['apiKey', 'userCard', 'userMembership', 'userTelecom', 'userStatus'];
      fields.forEach(id => {
        if(localStorage.getItem(id)) document.getElementById(id.replace(/([A-Z])/g, "-$1").toLowerCase()).value = localStorage.getItem(id);
      });
    });

    // 직관적인 저장
    function saveProfile() {
      const keyInput = document.getElementById('api-key').value.trim();
      if (!keyInput.startsWith("AQ.")) { alert("⚠️ API 키는 'AQ.'로 시작해야 합니다."); return; }
      
      const fields = ['apiKey', 'userCard', 'userMembership', 'userTelecom', 'userStatus'];
      fields.forEach(id => {
        localStorage.setItem(id, document.getElementById(id.replace(/([A-Z])/g, "-$1").toLowerCase()).value);
      });
      
      const btn = document.getElementById('save-btn');
      btn.innerText = "✅ 설정 완료!"; btn.style.background = "#28a745";
      setTimeout(() => { btn.innerText = "설정 완료"; btn.style.background = "var(--navy)"; }, 2000);
    }

    // 공유 수신 및 렌더링
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedData = urlParams.get('text') || urlParams.get('title') || urlParams.get('url');

      if (sharedData) {
        document.getElementById('profile-card').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
        document.getElementById('link-text').innerText = "🔗 수신: " + sharedData;

        const p = {
          card: localStorage.getItem('userCard') || 'none',
          mem: localStorage.getItem('userMembership') || 'none',
          tel: localStorage.getItem('userTelecom') || 'none',
          stat: localStorage.getItem('userStatus') || 'none'
        };
        
        const platform = detectPlatform(sharedData.toLowerCase());
        const db = benefitDB[platform];

        let staticHtml = `<b>📌 [${db.name}] 스카우터 1차 진단</b><br><br>`;
        staticHtml += db.base + "<br><br>";
        
        let hasBenefit = false;
        if(db.membership && db.membership[p.mem]) { staticHtml += db.membership[p.mem] + "<br>"; hasBenefit = true; }
        if(db.telecom && db.telecom[p.tel]) { staticHtml += db.telecom[p.tel] + "<br>"; hasBenefit = true; }
        if(db.card && db.card[p.card]) { staticHtml += db.card[p.card] + "<br>"; hasBenefit = true; }
        if(db.status && db.status[p.stat]) { staticHtml += db.status[p.stat] + "<br>"; hasBenefit = true; }
        if(!hasBenefit) { staticHtml += "설정하신 프로필에 맞는 플랫폼 전용 고정 혜택은 없습니다."; }
        
        document.getElementById('static-db-area').innerHTML = `<div class="db-result">${staticHtml}</div>`;

        analyzeWithAI_Robust(sharedData, p, platform);
      }
    });

    // ==========================================
    // 🧠 AI 연동 (스마트 에러 감지 + 45초 점진적 대기)
    // ==========================================
    async function analyzeWithAI_Robust(sharedText, p, platformName) {
      const SECRET_AI_KEY = localStorage.getItem('apiKey');
      if(!SECRET_AI_KEY) {
        document.getElementById('ai-loading').innerHTML = "❌ <b>API 키가 없습니다. 설정에서 키를 먼저 저장해주세요.</b>";
        return;
      }

      const cacheKey = "scouter_cache_v2_" + sharedText.replace(/\s/g, '').substring(0, 50); 
      const cachedData = localStorage.getItem(cacheKey);
      
      if (cachedData) {
        const parsedCache = JSON.parse(cachedData);
        if (((new Date().getTime() - parsedCache.timestamp) / (1000 * 60 * 60)) < 12) {
          document.getElementById('ai-analysis-area').innerHTML = parsedCache.html;
          return; 
        } else {
          localStorage.removeItem(cacheKey);
        }
      }

      const loadingPhrases = [
        "⏳ AI 정밀 분석 중...",
        "🔍 숨겨진 프로모션 찾는 중...",
        "💳 선택하신 카드 혜택 매칭 중...",
        "✨ 최적의 할인 조합 계산 중..."
      ];
      
      const aiLoadingEl = document.getElementById('ai-loading');
      aiLoadingEl.innerHTML = `<span id="ai-loading-text" style="color:var(--navy); font-size:15px; font-weight:bold;">${loadingPhrases[0]}</span>`;
      
      let phraseIdx = 0;
      const loadingInterval = setInterval(() => {
        phraseIdx = (phraseIdx + 1) % loadingPhrases.length;
        const textEl = document.getElementById('ai-loading-text');
        if(textEl) textEl.innerText = loadingPhrases[phraseIdx];
      }, 2000);

      const apiEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${SECRET_AI_KEY}`;
      const pText = `카드:${p.card}, 멤버십:${p.mem}, 통신사:${p.tel}, 신분:${p.stat}`;
      const prompt = `쇼핑 할인 요약 AI. 텍스트:"${sharedText}" 조건:[${pText}]
      일반 혜택은 제외하고 숨은 할인 요령과 결제 주의점만 분석해.
      반드시 아래 JSON 형식으로만 대답해:
      {
        "tips": ["할인 요령 1", "할인 요령 2"],
        "caution": "주의점 1문장"
      }`;

      // 💡 요청하신 10초 시작 -> 5초씩 증가 로직
      let delay = 10000; 
      let attempt = 1;

      while (true) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000); 

        try {
          const response = await fetch(apiEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { maxOutputTokens: 200, temperature: 0.2, responseMimeType: "application/json" } 
            }),
            signal: controller.signal
          });
          
          clearTimeout(timeoutId);
          const data = await response.json();

          // 무조건 재시도가 아니라 구글의 진짜 에러를 잡아냅니다.
          if (!response.ok) {
            const realErrorMsg = data.error?.message || "알 수 없는 에러";
            
            // 400(잘못된 요청), 403(권한/키 문제), 404(모델 이름 없음) 등은 재시도 금지 (무한루프 즉시 탈출)
            if (response.status === 400 || response.status === 403 || response.status === 404) {
              throw new Error(`FATAL:${realErrorMsg} (코드: ${response.status})`);
            }
            
            // 429(할당량 초과), 503(서버 터짐) 일 때만 재시도 진행
            throw new Error(`RETRY:서버 일시 혼잡`);
          }

          // 빈 데이터가 왔을 때의 방어막
          if (!data.candidates || data.candidates.length === 0 || !data.candidates[0].content) {
            throw new Error("RETRY:구글 서버가 빈 데이터를 보냈습니다.");
          }

          const parsedJson = JSON.parse(data.candidates[0].content.parts[0].text);
          if(!parsedJson.tips || !parsedJson.caution) throw new Error("RETRY:양식 오류");

          const tipsHtml = parsedJson.tips.map(tip => `✅ ${tip}`).join('<br>');
          const finalHtml = `
            <div class="ai-result">
              <span style="font-size:11px; color:#888; display:block; margin-bottom:8px;" class="cache-badge">✨ AI 실시간 최적화 완료</span>
              <b>💰 추가 할인 팁</b><br>${tipsHtml}<br><br>
              <b>⚠️ 결제 주의사항</b><br>🚨 ${parsedJson.caution}
            </div>
          `;
          
          localStorage.setItem(cacheKey, JSON.stringify({ html: finalHtml.replace("✨ AI 실시간 최적화 완료", "⚡ 내 폰에 임시저장된 결과 (0.1초 컷)"), timestamp: new Date().getTime() }));
          
          clearInterval(loadingInterval);
          document.getElementById('ai-analysis-area').innerHTML = finalHtml;
          break; 

        } catch (error) {
          clearTimeout(timeoutId);
          
          // 🚨 치명적 에러(FATAL)인 경우: 무한루프를 끊고 진짜 에러를 화면에 붉은색으로 출력
          if (error.message.startsWith("FATAL:")) {
            clearInterval(loadingInterval);
            document.getElementById('ai-analysis-area').innerHTML = `
              <div class="ai-result" style="background:#fce8e6; border:2px solid #d93025;">
                <b style="color:#d93025;">❌ 치명적 통신 오류 (재시도 중단)</b><br><br>
                <span style="font-size:13px; color:#333;">${error.message.replace("FATAL:", "")}</span><br><br>
                <span style="font-size:11px; color:#888;">* API 키가 잘못되었거나 구글 모델 정책이 변경되었을 수 있습니다.</span>
              </div>`;
            break; // 무한루프 완벽히 탈출
          }
          
          // 💡 배터리 보호: 아무리 45초 간격이라도 15회(약 8분~10분)를 넘어가면 최종 포기
          if (attempt >= 15) {
            clearInterval(loadingInterval);
            document.getElementById('ai-analysis-area').innerHTML = `
              <div class="ai-result" style="background:#f1f3f5; border:1px solid #ddd; color:#555;">
                <b>💡 AI 서버 응답 지연</b><br>
                지속적인 재시도에도 현재 서버가 응답하지 않습니다. 상단의 <b>[📌 1차 스카우터 진단]</b>을 먼저 확인해주세요.
              </div>
            `;
            break;
          }

          attempt++;
          // 에러 발생 시 지정된 시간만큼 대기
          await new Promise(resolve => setTimeout(resolve, delay));
          
          // 💡 다음 대기시간 계산: 기존 시간에서 5초씩 더하되, 45초(45000ms)를 넘지 않음
          delay = Math.min(delay + 5000, 45000); 
        }
      }
    }
  </script>
</body>
</html>
